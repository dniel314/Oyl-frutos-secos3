server:
  port: 0

spring:
  application:
    name: ms-usuarios-test
  # PostgreSQL real embebido (igual que en Docker). Ms*ApplicationTests asigna la URL.
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
  jpa:
    hibernate:
      # Flyway administra el esquema; Hibernate valida que las entidades coincidan.
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
